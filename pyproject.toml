[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deskid"
version = "1.0.0"
description = "DeskID authentication and identity microservice — email/password, Google/GitHub OAuth, JWKS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "email-validator>=2.0",
  "bcrypt>=4.0",
  "PyJWT[crypto]>=2.8",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "cryptography>=42.0",
]

[project.urls]
Homepage = "https://github.com/pisigmac/DeskId"
Repository = "https://github.com/pisigmac/DeskId.git"
Issues = "https://github.com/pisigmac/DeskId/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
deskid = "deskid.cli:main"
desk-id = "deskid.cli:main"
opendesk-auth = "deskid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:DeprecationWarning",
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
